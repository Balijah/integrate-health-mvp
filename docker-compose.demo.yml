services:
  db:
    container_name: integrate_health_demo_db
    environment:
      POSTGRES_DB: integrate_health_demo
    volumes:
      - demo_postgres_data:/var/lib/postgresql/data
    ports: !override
      - "127.0.0.1:${DEMO_DB_PORT:-5433}:5432"

  backend:
    container_name: integrate_health_demo_backend
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/integrate_health_demo
      ENVIRONMENT: demo
      DEMO_MODE: "true"
      STORAGE_MODE: local
      S3_BUCKET_NAME: ""
      SQS_QUEUE_URL: ""
      DEEPGRAM_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      APP_SECRET_KEY: ${APP_SECRET_KEY:?Set APP_SECRET_KEY in .env.demo}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env.demo}
      JWT_REFRESH_SECRET_KEY: ${JWT_REFRESH_SECRET_KEY:?Set JWT_REFRESH_SECRET_KEY in .env.demo}
      DEMO_USER_NAME: ${DEMO_USER_NAME:?Set DEMO_USER_NAME in .env.demo}
      DEMO_USER_EMAIL: ${DEMO_USER_EMAIL:?Set DEMO_USER_EMAIL in .env.demo}
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD:?Set DEMO_USER_PASSWORD in .env.demo}
    ports: !override
      - "127.0.0.1:${DEMO_BACKEND_PORT:-8001}:8000"

  frontend:
    container_name: integrate_health_demo_frontend
    environment:
      VITE_API_URL: http://localhost:${DEMO_BACKEND_PORT:-8001}
      VITE_DEMO_MODE: "true"
    ports: !override
      - "127.0.0.1:${DEMO_FRONTEND_PORT:-3001}:3000"

volumes:
  demo_postgres_data:
